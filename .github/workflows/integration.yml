name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: integration (mailhog)
    runs-on: ubuntu-latest

    services:
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025   # SMTP
          - 8025:8025   # HTTP API
        options: >-
          --health-cmd "wget -q -O- http://localhost:8025/api/v2/messages || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: wait for mailhog
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8025/api/v2/messages >/dev/null; then
              echo "mailhog is ready"
              exit 0
            fi
            sleep 1
          done
          echo "mailhog did not become ready" >&2
          exit 1

      - name: run integration tests
        env:
          SMTP_HOST: localhost
          SMTP_PORT: '1025'
          SMTP_API_URL: http://localhost:8025
        run: go test -tags integration -race -v ./integration/...