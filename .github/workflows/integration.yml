name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: integration (in-process SMTP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install test dependency
        run: go get github.com/emersion/go-smtp@latest

      - name: Run integration tests
        run: go test -tags=integration -race -v ./integration/...
        env:
          # Tests start their own SMTP server on 127.0.0.1:0;
          # no external host/port is required.
          CGO_ENABLED: '1'