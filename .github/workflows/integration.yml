name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: integration (in-process SMTP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Dependencies are pinned in go.mod; this primes the module cache
      # without bumping versions behind our back.
      - name: Download modules
        run: go mod download

      - name: Run integration tests
        run: go test -tags=integration -race -v ./integration_tests/...
        env:
          # Tests start their own SMTP server on 127.0.0.1:0;
          # no external host/port is required.
          CGO_ENABLED: '1'