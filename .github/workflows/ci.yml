name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the minimum version declared in go.mod
        go: ['1.26.8']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage
        if: matrix.go == '1.26.8'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    # Fuzzing is expensive; run only on PRs touching the parser/message code
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: run fuzz targets for a short time
        # Each target runs for 30s — enough to catch obvious regressions
        run: |
          for t in $(go test -list 'Fuzz.*' ./... | grep '^Fuzz'); do
            go test -run '^$' -fuzz "^${t}$" -fuzztime 30s ./... || exit 1
          done